name: Update README

on:
  push:            # Triggers on any push to any branch
  workflow_dispatch:     # Allows manual triggering from GitHub UI

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Modify README.md to update timestamp
        run: |
          echo "Last updated: $(date -u)" > last_updated.txt
          cat last_updated.txt >> README.md

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add README.md
          git commit -m "chore: auto-update README with latest timestamp" || echo "No changes to commit"
          git push
